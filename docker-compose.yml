services:
  server:
    build:
      context: ./server
      target: production
    ports:
      - "3021:3021"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3021
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  client:
    build:
      context: ./client
      target: production
    ports:
      - "3020:3020"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3020
      # Update these values during deployment
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost:3021}
    depends_on:
      - server
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
