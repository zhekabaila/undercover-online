services:
  server:
    build:
      context: ./server
      target: development
    ports:
      - "3021:3021"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3021

  client:
    build:
      context: ./client
      target: development
    ports:
      - "3020:3020"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3020
      - NEXT_PUBLIC_WS_URL=http://localhost:3021
    depends_on:
      - server
